[project]
name = "enterprise-search-ai"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic-settings>=2.7,<3",
 "structlog>=25,<27", "pymupdf>=1.25,<1.28", "pillow>=11,<13",
 "pytesseract>=0.3.13,<0.4", "numpy>=1.26,<3", "boto3>=1.36,<2",
 "httpx>=0.28,<1", "psutil>=6,<8",
]
[project.optional-dependencies]
models = ["sentence-transformers>=4,<6", "colpali-engine>=0.3.10,<0.4", "torch>=2.5,<2.10", "torchvision>=0.20,<0.25", "transformers>=4.51,<5", "sentencepiece>=0.2,<0.3"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "moto[s3]>=5,<6"]
[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')"]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["model: requires cached pretrained weights"]
[tool.ruff]
line-length = 105
