name: AI service
on:
  push:
    paths: ['ai/**', '.github/workflows/ai.yml']
  pull_request:
    paths: ['ai/**', '.github/workflows/ai.yml']
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - if: runner.os == 'macOS'
        run: brew list tesseract || brew install tesseract
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          "$env:ProgramFiles\Tesseract-OCR" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: uv sync --frozen --extra models --python 3.11
      - run: uv run --frozen --extra models pytest -q
      - run: uv run --frozen --extra models ruff check src scripts tests
      - run: uv run --frozen --extra models ruff format --check src scripts tests
